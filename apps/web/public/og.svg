  </defs>
  <rect width="1200" height="630" fill="#faf8ee"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1050" cy="192" r="218" fill="#3453ff" opacity=".12"/>
  <circle cx="965" cy="590" r="160" fill="#dfff43" opacity=".5"/>

  <g transform="translate(72 58)">
